server {
    listen 80;
    index index.html index.htm;

    # Проксирование API
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    # Проксирование админки
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    # Раздача медиа-файлов
    location /media/ {
        root /data/;
    }

    # Раздача фронтенда
    location / {
        root /static/;
        try_files $uri $uri/ /index.html;
    }
}
